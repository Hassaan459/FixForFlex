# Builds FixForFlex.zip and publishes a GitHub release for the version in manifest.json.
# Start it by pushing a tag like v1.1, or from the Actions tab ("Run workflow").
# The zip keeps the same name every release, so .../releases/latest/download/FixForFlex.zip always works.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from manifest.json
        run: |
          v=$(jq -r .version manifest.json)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but manifest.json says $v"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build zip
        run: |
          mkdir -p dist/FixForFlex
          cp -r manifest.json background.js content offscreen fonts icons ui README.md dist/FixForFlex/
          cd dist && zip -qr FixForFlex.zip FixForFlex
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run again with the same version (pre-release testing) and it replaces that release:
          # the tag moves to this commit and the zip is rebuilt, so the download link stays the same.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release delete "v$VERSION" --cleanup-tag --yes
          fi
          gh release create "v$VERSION" dist/FixForFlex.zip --target "$GITHUB_SHA" --title "FixForFlex $VERSION" --notes-file .github/release-notes.md --latest

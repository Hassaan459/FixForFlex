# Push a tag like v1.1 and this builds FixForFlex.zip and attaches it to a GitHub release.
# The zip keeps the same name every release, so .../releases/latest/download/FixForFlex.zip always works.
# The tag must match "version" in manifest.json.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches manifest.json
        run: |
          v=$(jq -r .version manifest.json)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but manifest.json says $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build zip
        run: |
          mkdir -p dist/FixForFlex
          cp -r manifest.json background.js content offscreen fonts icons ui README.md dist/FixForFlex/
          cd dist && zip -qr FixForFlex.zip FixForFlex
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/FixForFlex.zip --title "FixForFlex $VERSION" --notes-file .github/release-notes.md --latest
